name: Update ETF data

on:
  schedule:
    # KST 22:00 평일 (장 마감 후 NAV·순자산 확정치 반영)
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test 'test/*.test.mjs'

      # 수집 스크립트는 sanity gate(종목 수·TER 누락률 등) 실패 시 비정상 종료하며,
      # 그 경우 기존 docs/data.json이 그대로 유지된다 (부분 데이터 커밋 방지)
      - name: Fetch ETF data
        run: node scripts/build-data.mjs

      - name: Build artifact snapshot
        run: node scripts/build-artifact.mjs

      - name: Commit & push if changed
        run: |
          if git diff --quiet docs/; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "data: refresh $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
